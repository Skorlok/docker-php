name: Build & Push PHP Docker Images

on:
  push:
    branches:
      - master
    paths:
      - 'php*'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      dockerfiles_json: ${{ steps.set.outputs.dockerfiles_json }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          files=$(ls php* 2>/dev/null || true)
          files_json=$(echo $files | tr ' ' '\n' | jq -R -s -c 'split("\n")[:-1]')
          echo "dockerfiles_json=$files_json" >> $GITHUB_OUTPUT

  build-amd64:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: ${{ fromJSON(needs.detect.outputs.dockerfiles_json) }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set Docker tag
        id: tag
        run: |
          TAG=${{ matrix.dockerfile }}
          TAG=${TAG#php}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
      - name: Build & Push AMD64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: skorlok/php:${{ steps.tag.outputs.TAG }}-amd64

  build-arm64:
    needs: detect
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        dockerfile: ${{ fromJSON(needs.detect.outputs.dockerfiles_json) }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set Docker tag
        id: tag
        run: |
          TAG=${{ matrix.dockerfile }}
          TAG=${TAG#php}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
      - name: Build & Push ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: skorlok/php:${{ steps.tag.outputs.TAG }}-arm64

  manifest:
    needs: [detect, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: ${{ fromJSON(needs.detect.outputs.dockerfiles_json) }}

    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set Docker tag
        id: tag
        run: |
          TAG=${{ matrix.dockerfile }}
          TAG=${TAG#php}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            -t skorlok/php:${{ steps.tag.outputs.TAG }} \
            skorlok/php:${{ steps.tag.outputs.TAG }}-amd64 \
            skorlok/php:${{ steps.tag.outputs.TAG }}-arm64