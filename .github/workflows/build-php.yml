name: Build & Push PHP Docker Images
on:
  push:
    branches:
      - master
    paths:
      - 'php*'
      - 'combinedPHP'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      dockerfiles_json: ${{ steps.set.outputs.dockerfiles_json }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          files=$(ls php* 2>/dev/null || true)
          files_json=$(echo $files | tr ' ' '\n' | jq -R -s -c 'split("\n")[:-1]')
          echo "dockerfiles_json=$files_json" >> $GITHUB_OUTPUT

  build-amd64:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: ${{ fromJSON(needs.detect.outputs.dockerfiles_json) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Docker tag
        id: tag
        run: |
          TAG=${{ matrix.dockerfile }}
          TAG=${TAG#php}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
      - name: Build & Push AMD64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/skorlok/docker-php:${{ steps.tag.outputs.TAG }}-amd64

  build-arm64:
    needs: detect
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        dockerfile: ${{ fromJSON(needs.detect.outputs.dockerfiles_json) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Docker tag
        id: tag
        run: |
          TAG=${{ matrix.dockerfile }}
          TAG=${TAG#php}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
      - name: Build & Push ARM64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/skorlok/docker-php:${{ steps.tag.outputs.TAG }}-arm64

  manifest:
    needs: [detect, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: ${{ fromJSON(needs.detect.outputs.dockerfiles_json) }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set Docker tag
        id: tag
        run: |
          TAG=${{ matrix.dockerfile }}
          TAG=${TAG#php}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            -t skorlok/php:${{ steps.tag.outputs.TAG }} \
            ghcr.io/skorlok/docker-php:${{ steps.tag.outputs.TAG }}-amd64 \
            ghcr.io/skorlok/docker-php:${{ steps.tag.outputs.TAG }}-arm64

  build-combined:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push combined
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./combinedPHP
          platforms: linux/amd64,linux/arm64
          push: true
          tags: skorlok/php:combined

  extract-amd64:
    needs: build-combined
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract AMD64
        run: |
          docker pull --platform linux/amd64 skorlok/php:combined
          id=$(docker create --platform linux/amd64 skorlok/php:combined /bin/sh)
          mkdir -p ./rootfs/usr/local/bin ./rootfs/usr/local/lib/php ./rootfs/opt
          docker cp $id:/usr/local/bin/. ./rootfs/usr/local/bin/
          docker cp $id:/usr/local/lib/php/extensions/. ./rootfs/usr/local/lib/php/extensions/
          docker cp $id:/opt/. ./rootfs/opt/
          docker rm $id
          find ./rootfs/usr/local/bin/ -maxdepth 1 -type f ! -name 'php*.*' -delete
          tar -czf php-combined-amd64.tar.gz -C ./rootfs .
      - uses: actions/upload-artifact@v7
        with:
          name: php-combined-amd64
          path: php-combined-amd64.tar.gz

  extract-arm64:
    needs: build-combined
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract ARM64
        run: |
          docker pull --platform linux/arm64 skorlok/php:combined
          id=$(docker create --platform linux/arm64 skorlok/php:combined /bin/sh)
          mkdir -p ./rootfs/usr/local/bin ./rootfs/usr/local/lib/php ./rootfs/opt
          docker cp $id:/usr/local/bin/. ./rootfs/usr/local/bin/
          docker cp $id:/usr/local/lib/php/extensions/. ./rootfs/usr/local/lib/php/extensions/
          docker cp $id:/opt/. ./rootfs/opt/
          docker rm $id
          find ./rootfs/usr/local/bin/ -maxdepth 1 -type f ! -name 'php*.*' -delete
          tar -czf php-combined-arm64.tar.gz -C ./rootfs .
      - uses: actions/upload-artifact@v7
        with:
          name: php-combined-arm64
          path: php-combined-arm64.tar.gz

  release:
    needs: [extract-amd64, extract-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: php-combined-amd64
      - uses: actions/download-artifact@v8
        with:
          name: php-combined-arm64
      - name: Set date
        id: date
        run: echo "DATE=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.DATE }}
          name: PHP Combined ${{ steps.date.outputs.DATE }}
          files: |
            php-combined-amd64.tar.gz
            php-combined-arm64.tar.gz
