name: Build & Push PHP Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'php*'

env:
  IMAGE_NAME: skorlok/php

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.set.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^php' || true)
          echo "dockerfiles=$files" >> $GITHUB_OUTPUT

  build:
    needs: detect
    if: ${{ needs.detect.outputs.dockerfiles != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [${{fromJSON('["' + needs.detect.outputs.dockerfiles | replace('\n','","') + '"]')}}]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            skorlok/${{ env.IMAGE_NAME }}:latest
