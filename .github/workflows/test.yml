name: Extract & Release PHP binaries
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build & Push PHP Docker Images"]
    types:
      - completed
	  
permissions:
  contents: write
  packages: write

jobs:
  extract-amd64:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract AMD64
        run: |
          docker pull --platform linux/amd64 skorlok/php:combined
          id=$(docker create --platform linux/amd64 skorlok/php:combined /bin/sh)
          mkdir -p ./rootfs/usr/local/bin ./rootfs/usr/local/lib/php ./rootfs/opt
          docker cp $id:/usr/local/bin/. ./rootfs/usr/local/bin/
          docker cp $id:/usr/local/lib/php/extensions/. ./rootfs/usr/local/lib/php/extensions/
          docker cp $id:/opt/. ./rootfs/opt/
          docker rm $id
          find ./rootfs/usr/local/bin/ -maxdepth 1 -type f ! -name 'php*.*' -delete
          tar -czf php-combined-amd64.tar.gz -C ./rootfs .
      - uses: actions/upload-artifact@v4
        with:
          name: php-combined-amd64
          path: php-combined-amd64.tar.gz

  extract-arm64:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract ARM64
        run: |
          docker pull --platform linux/arm64 skorlok/php:combined
          id=$(docker create --platform linux/arm64 skorlok/php:combined /bin/sh)
          mkdir -p ./rootfs/usr/local/bin ./rootfs/usr/local/lib/php ./rootfs/opt
          docker cp $id:/usr/local/bin/. ./rootfs/usr/local/bin/
          docker cp $id:/usr/local/lib/php/extensions/. ./rootfs/usr/local/lib/php/extensions/
          docker cp $id:/opt/. ./rootfs/opt/
          docker rm $id
          find ./rootfs/usr/local/bin/ -maxdepth 1 -type f ! -name 'php*.*' -delete
          tar -czf php-combined-arm64.tar.gz -C ./rootfs .
      - uses: actions/upload-artifact@v4
        with:
          name: php-combined-arm64
          path: php-combined-arm64.tar.gz

  release:
    needs: [extract-amd64, extract-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: php-combined-amd64
      - uses: actions/download-artifact@v4
        with:
          name: php-combined-arm64
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_id }}
          name: PHP Combined ${{ github.run_id }}
          files: |
            php-combined-amd64.tar.gz
            php-combined-arm64.tar.gz